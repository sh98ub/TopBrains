<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Index-Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Simple Calculator</h2>

    <input type="number" id="num1" placeholder="First Number">
    <input type="number" id="num2" placeholder="Second Number">

   <div class="buttons">
    <button class="add-btn" onclick="add()">Add</button>
    <button class="sub-btn" onclick="subtract()">Subtract</button>
    <button class="mul-btn" onclick="multiply()">Multiply</button>
    <button class="div-btn" onclick="divide()">Divide</button>
</div>

    <h3 id="result">Result: </h3>
</div>

<script src="script.js"></script>
</body>
</html>
